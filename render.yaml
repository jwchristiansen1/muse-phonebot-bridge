# Render deployment for the Muse Phonebot bridge.
# Put this file, muse-phonebot-bridge.py and requirements.txt in one
# GitHub repo, then in Render choose New > Web Service > that repo.
# Render reads this file and fills in most of the settings for you.
services:
  - type: web
    name: muse-phonebot-bridge
    env: python
    buildCommand: ""
    startCommand: python3 muse-phonebot-bridge.py
    plan: starter
    envVars:
      - key: BRIDGE_WAKE_KEY
        sync: false
      - key: BRIDGE_MUSE_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: BRIDGE_FROM_NUMBER
        value: +13852339099
